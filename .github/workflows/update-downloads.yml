name: update-downloads

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect Release download counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pwsh ./tools/update-downloads.ps1 -Root . -Repo "${{ github.repository }}"

      - name: Regenerate index
        run: pwsh ./tools/make-index.ps1 -Root .

      - name: Commit index.json
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json 没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: refresh release download counts"
          git push
